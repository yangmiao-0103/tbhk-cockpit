<script>
const CACHE_KEY="tbhk_ck_auth";
const CACHE_TTL=30*60*1000; // 30 分钟

function saveAuth(pw){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({pw:btoa(encodeURIComponent(pw)),ts:Date.now()}));}catch(e){}
}
function loadAuth(){
  try{
    const j=JSON.parse(localStorage.getItem(CACHE_KEY));
    if(j&&(Date.now()-j.ts)<CACHE_TTL) return decodeURIComponent(atob(j.pw));
    localStorage.removeItem(CACHE_KEY);
  }catch(e){localStorage.removeItem(CACHE_KEY);}
  return null;
}

async function doDecrypt(pw){
  const raw=Uint8Array.from(atob(document.getElementById("payload").textContent),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},
    keyMaterial,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  const html=new TextDecoder().decode(plain);
  saveAuth(pw);
  document.open();document.write(html);document.close();
}

async function unlock(){
  const pw=document.getElementById("pw").value;
  if(!pw){document.getElementById("err").textContent="请输入密码";return;}
  document.getElementById("err").textContent="解密中...";
  try{
    await doDecrypt(pw);
  }catch(e){
    document.getElementById("err").textContent="密码错误，请重试";
    document.getElementById("pw").select();
  }
}

// 页面加载时自动尝试缓存的密码
(async function autoUnlock(){
  const cached=loadAuth();
  if(!cached) return;
  try{await doDecrypt(cached);}catch(e){localStorage.removeItem(CACHE_KEY);}
})();
</script>
